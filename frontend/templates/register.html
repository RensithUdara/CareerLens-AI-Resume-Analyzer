{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="container page">
  <div class="page-head reveal">
    <div>
      <div class="eyebrow">Create workspace</div>
      <h1>Start analyzing</h1>
      <p>Save resume versions, job matches, and improvement history in one place.</p>
    </div>
  </div>

  <div class="card auth-shell reveal">
    <form id="register-form">
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required minlength="2">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
      <div class="form-error" id="form-error"></div>
    </form>
    <p style="margin-top:16px;">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
